services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - agora_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "--host", "mongo:27017", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]

  api:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/agora?replicaSet=rs0
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ../agora-fe
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  agora_mongo:
